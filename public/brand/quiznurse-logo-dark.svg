<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%" fill="none">
  <!-- QuizNurse Primary Horizontal Logo (Dark Surfaces) -->
  <defs>
    <linearGradient id="qnTealGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#5EEAD4" />
    </linearGradient>
    <linearGradient id="qnAmberGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
  </defs>

  <!-- Scaled Vector Symbol -->
  <g transform="translate(6, 6) scale(0.68)">
    <path d="M 67 65 A 32 32 0 1 0 76 46"
          stroke="url(#qnTealGradDark)"
          stroke-width="9.5"
          stroke-linecap="round" />
    <path d="M 37 59 L 37 41 C 37 36 41 34 45 37 L 54 55 C 57 60 62 57 62 52 L 62 36"
          stroke="#E2E8F0"
          stroke-width="7.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <path d="M 52 52 L 77 77"
          stroke="url(#qnAmberGradDark)"
          stroke-width="9.5"
          stroke-linecap="round" />
    <path d="M 65 77 L 77 77 L 77 65"
          stroke="url(#qnAmberGradDark)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <circle cx="50" cy="22" r="5" fill="url(#qnAmberGradDark)" />
  </g>

  <!-- Wordmark: QuizNurse -->
  <g transform="translate(86, 48)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#F8FAFC">Quiz</tspan>
      <tspan fill="#2DD4BF">Nurse</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(88, 64)">
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="1.2">
      NURSING EXAMINATION PREPARATION
    </text>
  </g>
