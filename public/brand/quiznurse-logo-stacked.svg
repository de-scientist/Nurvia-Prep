    <circle cx="50" cy="22" r="5" fill="url(#qnAmberGradStacked)" />
  </g>

  <!-- Wordmark Centered -->
  <text x="100" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
