  </text>

  <!-- Badge -->
  <rect x="385" y="420" width="310" height="44" rx="22" fill="#148387" fill-opacity="0.4" stroke="#2DD4BF" stroke-width="1.5" />
  <text x="540" y="448" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    OFFICIAL: QUIZNURSE.COM
